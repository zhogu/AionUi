<!doctype html>
<html data-theme="light" data-color-scheme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="AionUi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AionUi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4E5969" />
    <link rel="icon" type="image/png" href="./pwa/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa/icon-180.png" />
    <title>AionUi</title>
    <script>
      // Synchronously restore theme appearance from localStorage to prevent theme flash
      (function () {
        try {
          var theme = localStorage.getItem('__aionui_theme');
          if (theme) document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #boot-status {
        box-sizing: border-box;
        padding: 32px;
        max-width: 640px;
        margin: 15vh auto;
        font:
          16px/1.6 system-ui,
          sans-serif;
        color: var(--color-text-1, CanvasText);
      }
      #boot-status a {
        display: inline-block;
        padding: 12px 0;
        color: LinkText;
      }
    </style>
  </head>
  <body>
    <script>
      // Set arco-theme on body synchronously
      try {
        var t = localStorage.getItem('__aionui_theme');
        if (t) document.body.setAttribute('arco-theme', t);
      } catch (e) {}
    </script>
    <div id="root">
      <div id="boot-status" role="status">
        <strong>AionUi</strong>
        <p id="boot-message"></p>
        <a id="boot-reload" href="" hidden></a>
      </div>
    </div>
    <script>
      // This recovery UI must work even when React/the vendor chunk never loads.
      (function () {
        var messages = __AIONUI_BOOT_MESSAGES__;
        var language = navigator.language || 'en-US';
        var locale = messages[language]
          ? language
          : Object.keys(messages).find(function (key) {
              return key.split('-')[0] === language.split('-')[0];
            });
        var text = messages[locale] || messages['en-US'];
        var status = document.getElementById('boot-status');
        var message = document.getElementById('boot-message');
        var reload = document.getElementById('boot-reload');
        message.textContent = text.loading;
        reload.textContent = text.reload;
        reload.onclick = function (event) {
          event.preventDefault();
          window.location.reload();
        };
        function failed() {
          if (!status.isConnected) return;
          message.textContent = text.failed;
          reload.hidden = false;
        }
        function onError(event) {
          var target = event.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) failed();
        }
        window.addEventListener('error', onError, true);
        var timer = setTimeout(failed, 15000);
        var observer = new MutationObserver(function () {
          if (status.isConnected) return;
          clearTimeout(timer);
          window.removeEventListener('error', onError, true);
          observer.disconnect();
        });
        observer.observe(document.getElementById('root'), { childList: true });
      })();
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
